<script>

document.addEventListener(
    "DOMContentLoaded",
    async function () {

        /*
        Wait for products.js to load products.
        */

        if (
            typeof loadProducts === "function"
        ) {

            await loadProducts();

        }


        /*
        Get product ID from URL.
        Example:

        product.html?id=123
        */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const productId =
            params.get("id");


        if (
            !productId ||
            typeof getProductById !== "function"
        ) {

            return;

        }


        const product =
            getProductById(productId);


        if (!product) {

            return;

        }


        /*
        PRODUCT INFORMATION
        */

        const productName =
            product.name ||
            "Product";


        const productDescription =
            product.description ||
            (
                productName +
                " available at Peppy Fashion. " +
                "Shop quality fashion products online in Bangladesh."
            );


        const productImage =
            product.image ||
            "https://peppyfashion775.github.io/peppy-fashion-v2/assets/images/logo/logo.png";


        const productUrl =
            window.location.origin +
            window.location.pathname +
            "?id=" +
            encodeURIComponent(product.id);


        /*
        UPDATE PAGE TITLE
        */

        document.title =
            productName +
            " | Peppy Fashion";


        /*
        UPDATE META DESCRIPTION
        */

        const descriptionMeta =
            document.querySelector(
                'meta[name="description"]'
            );


        if (descriptionMeta) {

            descriptionMeta.setAttribute(
                "content",
                productDescription
            );

        }


        /*
        UPDATE CANONICAL
        */

        const canonical =
            document.getElementById(
                "canonicalUrl"
            );


        if (canonical) {

            canonical.setAttribute(
                "href",
                productUrl
            );

        }


        /*
        UPDATE FACEBOOK / OPEN GRAPH
        */

        const ogTitle =
            document.getElementById(
                "ogTitle"
            );


        if (ogTitle) {

            ogTitle.setAttribute(
                "content",
                productName +
                " | Peppy Fashion"
            );

        }


        const ogDescription =
            document.getElementById(
                "ogDescription"
            );


        if (ogDescription) {

            ogDescription.setAttribute(
                "content",
                productDescription
            );

        }


        const ogUrl =
            document.getElementById(
                "ogUrl"
            );


        if (ogUrl) {

            ogUrl.setAttribute(
                "content",
                productUrl
            );

        }


        const ogImage =
            document.getElementById(
                "ogImage"
            );


        if (ogImage) {

            ogImage.setAttribute(
                "content",
                productImage
            );

        }


        const ogImageAlt =
            document.getElementById(
                "ogImageAlt"
            );


        if (ogImageAlt) {

            ogImageAlt.setAttribute(
                "content",
                productName
            );

        }


        /*
        UPDATE TWITTER
        */

        const twitterTitle =
            document.getElementById(
                "twitterTitle"
            );


        if (twitterTitle) {

            twitterTitle.setAttribute(
                "content",
                productName +
                " | Peppy Fashion"
            );

        }


        const twitterDescription =
            document.getElementById(
                "twitterDescription"
            );


        if (twitterDescription) {

            twitterDescription.setAttribute(
                "content",
                productDescription
            );

        }


        const twitterImage =
            document.getElementById(
                "twitterImage"
            );


        if (twitterImage) {

            twitterImage.setAttribute(
                "content",
                productImage
            );

        }


        /*
        PRODUCT STRUCTURED DATA
        */

        const schema =
            document.getElementById(
                "productSchema"
            );


        if (schema) {

            const schemaData = {

                "@context":
                    "https://schema.org",

                "@type":
                    "Product",

                "name":
                    productName,

                "description":
                    productDescription,

                "image": [
                    productImage
                ],

                "brand": {

                    "@type":
                        "Brand",

                    "name":
                        "Peppy Fashion"

                },

                "category":
                    product.category ||
                    "Fashion",

                "sku":
                    String(product.id),

                "offers": {

                    "@type":
                        "Offer",

                    "url":
                        productUrl,

                    "priceCurrency":
                        "BDT",

                    "price":
                        String(
                            product.price || 0
                        ),

                    "availability":
                        Number(product.stock) > 0
                        ? "https://schema.org/InStock"
                        : "https://schema.org/OutOfStock",

                    "seller": {

                        "@type":
                            "Organization",

                        "name":
                            "Peppy Fashion"

                    }

                }

            };


            schema.textContent =
                JSON.stringify(
                    schemaData
                );

        }

    }

);

</script>
